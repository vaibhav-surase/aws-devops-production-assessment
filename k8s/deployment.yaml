apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-assessment-app
  labels:
    app: devops-assessment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-assessment-app
  template:
    metadata:
      labels:
        app: devops-assessment-app
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
